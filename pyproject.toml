[project]
name = "techfi-voice-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "apps/voice-worker", "packages/shared"]

[tool.uv.sources]
techfi-shared = { workspace = true }

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: local socket-level checks; no provider calls or microphone"]
